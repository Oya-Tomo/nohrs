services:
  nohrs:
    build:
      context: ../..
      dockerfile: docker/ci/Dockerfile
    environment:
      - DISPLAY=:99
    volumes:
      - ../..:/nohrs
      - ${HOME}/.cargo/registry:/root/.cargo/registry
    entrypoint: ["/bin/bash", "-lc", "Xvfb :99 -screen 0 1280x800x24 >/tmp/xvfb.log 2>&1 & sleep 1 && exec \"$@\"", "--"]
    command: ["cargo", "test"]
